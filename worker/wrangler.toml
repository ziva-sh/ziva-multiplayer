name = "ziva-multiplayer"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Hibernation API requires the Durable Object to be class-bound and listed in
# new_sqlite_classes so its state is durable across hibernation.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# ConnRateDO bounds raw connection attempts (per-IP and per-(u,g)) so the
# no-negative-cache access check can't be turned into unbounded /check fan-out.
[[durable_objects.bindings]]
name = "CONN_RATE"
class_name = "ConnRateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ConnRateDO"]

# Analytics Engine for usage metrics (peer connects, bytes in/out).
[[analytics_engine_datasets]]
binding = "MULTIPLAYER_EVENTS"
dataset = "multiplayer"

# Top-level vars are used by local `wrangler dev` and the vitest suite. The
# tests stub this origin's /api/multiplayer/check via the Miniflare fetch mock.
[vars]
ZIVA_API_BASE = "http://localhost:3000"
LOG_DRAIN_URL = ""

# ---- Staging environment ----
# Deployed via `wrangler deploy --env staging`. Hostname is the default
# *.workers.dev — ziva.sh DNS is at Namecheap so we can't easily attach a
# custom domain (out of scope for v1).
[env.staging]
name = "ziva-multiplayer-staging"

[[env.staging.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[env.staging.durable_objects.bindings]]
name = "CONN_RATE"
class_name = "ConnRateDO"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["ConnRateDO"]

# Analytics Engine — staging writes to the same dataset as prod; rollup cron
# filters by environment if needed.
[[env.staging.analytics_engine_datasets]]
binding = "MULTIPLAYER_EVENTS"
dataset = "multiplayer"

# ZIVA_API_BASE — apps/web origin the access check (/api/multiplayer/check)
# hits. LOG_DRAIN_URL is plain text, POSTed-to by room-do for structured
# events; empty means "no log drain" and the Worker no-ops cleanly.
[env.staging.vars]
ZIVA_API_BASE = "https://staging.ziva.sh"
LOG_DRAIN_URL = ""

# ---- Production environment ----
[env.production]
name = "ziva-multiplayer"

[[env.production.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[env.production.durable_objects.bindings]]
name = "CONN_RATE"
class_name = "ConnRateDO"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["ConnRateDO"]

[[env.production.analytics_engine_datasets]]
binding = "MULTIPLAYER_EVENTS"
dataset = "multiplayer"

[env.production.vars]
ZIVA_API_BASE = "https://ziva.sh"
LOG_DRAIN_URL = ""
